# Intégration continue : tests du serveur, tests de l'appli et recherche de fuites. Aucun déploiement ici :
# la maison n'est jamais joignable depuis GitHub. Les actions sont figées par empreinte.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Tests du serveur
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poc/requirements.txt
      - name: Bibliothèques système
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Dépendances
        run: python -m pip install -r poc/requirements.txt
      - name: Tests sur config-exemple
        run: python -m pytest poc/tests -q

  appli:
    name: Tests de l'appli Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASSISTANT_VOCAL_CONFIG: ${{ github.workspace }}/config-exemple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Tests unitaires
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

  fuites:
    name: Recherche de fuites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Liste privée des mots interdits
        env:
          MOTS_INTERDITS: ${{ secrets.MOTS_INTERDITS }}
        run: |
          if [ -n "$MOTS_INTERDITS" ]; then
            mkdir -p config
            printf '%s\n' "$MOTS_INTERDITS" > config/mots-interdits.txt
          else
            echo "::warning::Secret MOTS_INTERDITS absent : le garde-fou tourne sans la liste privée."
          fi
      - name: Garde-fou sur tout l'historique
        run: bash .githooks/garde-fou.sh --historique
      - name: Gitleaks sur tout l'historique
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm -f "$archive"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner --config .gitleaks.toml --log-opts="--all -m"
