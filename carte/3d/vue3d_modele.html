<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Appartement 3D</title>
<!-- Modèle de page : generer_3d.py remplace les marqueurs et écrit vue3d.html. Ne pas ouvrir ce fichier directement. -->
<style>
  :root { --fond: #000000; --texte: #8C8C8C; --texte-fort: #CFCFCF; --panneau: rgba(18, 18, 20, 0.88); --bord: #2A2A2E; --allume: #FFC86B; }
  html, body { margin: 0; height: 100%; background: var(--fond); overflow: hidden; color: var(--texte);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  /* fondu des bords dans le noir (aperçu de l'écran ambiant) : la scène flotte au lieu d'être encadrée.
     --bord : largeur du fondu, 23 % par défaut, moins sur l'écran ambiant où la vue est grande */
  body { --bord: 23%; }
  body.fondu #scene canvas {
    --m1: calc(var(--bord) * 0.35); --m2: calc(var(--bord) * 0.65);
    -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.3) var(--m1), rgba(0,0,0,.75) var(--m2), #000 var(--bord), #000 calc(100% - var(--bord)), rgba(0,0,0,.75) calc(100% - var(--m2)), rgba(0,0,0,.3) calc(100% - var(--m1)), transparent 100%),
                        linear-gradient(to bottom, transparent 0, rgba(0,0,0,.3) var(--m1), rgba(0,0,0,.75) var(--m2), #000 var(--bord), #000 calc(100% - var(--bord)), rgba(0,0,0,.75) calc(100% - var(--m2)), rgba(0,0,0,.3) calc(100% - var(--m1)), transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.3) var(--m1), rgba(0,0,0,.75) var(--m2), #000 var(--bord), #000 calc(100% - var(--bord)), rgba(0,0,0,.75) calc(100% - var(--m2)), rgba(0,0,0,.3) calc(100% - var(--m1)), transparent 100%),
                linear-gradient(to bottom, transparent 0, rgba(0,0,0,.3) var(--m1), rgba(0,0,0,.75) var(--m2), #000 var(--bord), #000 calc(100% - var(--bord)), rgba(0,0,0,.75) calc(100% - var(--m2)), rgba(0,0,0,.3) calc(100% - var(--m1)), transparent 100%);
    mask-composite: intersect;
  }
  body.fondu #version { display: none; }
  /* dans l'appli (0.7.1) et dans le client web (1.0.0), la version est affichée par l'hôte lui-même (vue3d.version()) */
  body.appli #version { display: none; }
  /* scène atténuée pendant l'écoute de l'assistant (écran ambiant) */
  #scene { position: fixed; inset: 0; transition: opacity .45s ease; }
  /* fond du régime vivant (0.7.0) : dégradé, ombre, flaque, grain et particules, sous la toile 3D
     transparente et hors de #scene, pour rester vivant pendant l'écoute */
  #fond { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  #panneau { position: fixed; top: 12px; right: 12px; width: 236px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px; padding: 10px 10px 6px; font-size: 13px; box-sizing: border-box; }
  #panneau.cache { display: none; }
  #panneau h2 { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #666; margin: 10px 2px 4px; }
  #panneau h2:first-child { margin-top: 0; }
  .lampe { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; margin: 2px 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--texte-fort); font: inherit; text-align: left; cursor: pointer; }
  .lampe:hover { background: #1E1E22; }
  .pastille { width: 10px; height: 10px; border-radius: 50%; background: #333; flex: none; box-shadow: none; transition: background .3s, box-shadow .3s; }
  .lampe.on .pastille { background: var(--allume); box-shadow: 0 0 8px var(--allume); }
  .estimee { color: #666; font-size: 11px; margin-left: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .actions button { flex: 1 1 auto; padding: 6px 8px; border: 1px solid var(--bord); border-radius: 8px; background: #141416; color: var(--texte-fort); font: inherit; cursor: pointer; }
  .actions button:hover { background: #1E1E22; }
  /* la maison en grand (0.8.0) : voile sur les autres pièces, étiquettes des pièces et pastilles des objets,
     au-dessus de la scène et sans toucher (l'appli désigne ce qui est sous le doigt par vue3d.designer) */
  #voile { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #grand { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  .etiq { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); text-align: center; white-space: nowrap;
    color: #E8E2D8; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75); transition: opacity .3s; }
  /* cadenas devant le nom d'une pièce protégée : une classe, car la page n'admet aucun attribut style (CSP du client web) */
  .cad { vertical-align: -0.05em; margin-right: 0.35em; }
  .etiq b { font-weight: 400; display: block; }
  .etiq small { display: block; color: #D6CFC3; }
  .past { position: absolute; left: 0; top: 0; border-radius: 50%; opacity: 0; transition: opacity .15s;
    background: radial-gradient(circle at 40% 35%, rgba(52, 49, 44, 0.95), rgba(35, 33, 29, 0.95));
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(238, 234, 226, 0.1); }
  .past svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .past.surligne { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(238, 234, 226, 0.1), 0 0 0 3px rgba(238, 234, 226, 0.35); }
  /* mesures par pièce (0.9.0, S-L7) : pastille sous le nom de chaque pièce en vue entière, carton de la pièce choisie
     en bas à gauche. Toujours un mot à côté de la couleur, jamais une couleur seule. */
  .etiq .mes { display: inline-block; margin-top: 0.25em; padding: 0.05em 0.6em; border-radius: 999px; color: #1B1A17; text-shadow: none; white-space: nowrap; }
  #mesures { position: fixed; left: 14px; bottom: 30px; max-width: 46%; pointer-events: none; padding: 0.7em 0.95em; border-radius: 14px;
    background: rgba(26, 25, 22, 0.86); color: #E8E2D8; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(238, 234, 226, 0.1); opacity: 0; transition: opacity .3s; }
  #mesures.visible { opacity: 1; }
  #mesures b { display: block; font-weight: 500; color: #EEEAE2; }
  #mesures .ml { display: flex; align-items: baseline; gap: 0.6em; margin-top: 0.3em; white-space: nowrap; }
  #mesures .ml .n { color: #BAB2A6; min-width: 5.5em; }
  #mesures .ml .v { color: #EEEAE2; }
  #mesures .mot { padding: 0 0.6em; border-radius: 999px; color: #1B1A17; font-weight: 600; }
  #mesures .suiv { display: block; margin: 0.05em 0 0 6.1em; color: #BAB2A6; font-size: 0.8em; white-space: nowrap; }
  #mesures .alerte { display: block; margin-top: 0.5em; color: #F2994A; }
  #mesures .vide { display: block; margin-top: 0.3em; color: #BAB2A6; }
  #version { position: fixed; left: 10px; bottom: 8px; font-size: 11px; color: #4A4A4A; pointer-events: none; }
  @media (max-width: 520px) { #panneau { width: calc(100% - 24px); max-height: 45%; top: auto; bottom: 28px; } }
</style>
</head>
<body>
<div id="panneau">
  <div class="actions">
    <button id="b-demo">Démo</button><button id="b-tout">Tout allumer</button><button id="b-rien">Tout éteindre</button>
  </div>
  <div class="actions">
    <button id="b-act-on">Action : allumer le salon</button><button id="b-act-off">Action : éteindre le salon</button>
  </div>
  <div class="actions">
    <button id="b-vue">Vue de dessus</button><button id="b-jour">Mode jour</button><button id="b-murs">Murs hauts</button>
  </div>
  <div id="liste"></div>
</div>
<script>
  // dans l'appli et dans l'iframe du client web, le panneau de démonstration ne doit jamais apparaître, même avant la fin du chargement
  if (/[?&]panneau=0/.test(location.search) || window.Maison3dAndroid || window.parent !== window) document.getElementById("panneau").classList.add("cache");
  if (window.Maison3dAndroid || window.parent !== window) document.body.classList.add("appli");
</script>
<canvas id="fond"></canvas>
<div id="scene"></div>
<canvas id="voile"></canvas>
<div id="grand"></div>
<div id="mesures"></div>
<div id="version">Plan 3D v{{VERSION}} du {{DATE}}</div>
<script>(function(){"use strict";
/*THREE*/
})();</script>
<script>
"use strict";
const DONNEES = /*SCENE*/;
const T = THREE;
const params = new URLSearchParams(location.search);
// Page montée dans l'iframe isolée du client web (sandbox sans allow-same-origin) : elle ne parle alors qu'à la page
// qui la contient, par postMessage (voir « pont postMessage » plus bas), et n'appelle jamais le serveur elle-même.
const INTEGRE = window.parent !== window && !window.Maison3dAndroid;

// ---------- teintes ----------
// Teintes de la scène (0.4.1). L'appli envoie sa palette (Palette.kt) par vue3d.teintes dès le
// chargement : ces valeurs ne servent qu'à la page ouverte seule dans un navigateur. Tout ce qui est
// éteint est en neutre strict, sans bleu ni saturation, un seul matériau mat.
// Jeux de teintes (0.5.0) : « neutre » (gris sombres d'origine) et « couleur » (demande du 22/10 :
// garder le fond noir, mais un appartement en couleur et bien plus contrasté). teintes({jeu}) repart du jeu
// choisi avant d'appliquer les autres clés reçues. sol_<type> : sol d'un type de pièce, sinon « sol ».
// meublesReels : chaque meuble prend sa couleur de meubles.json au lieu du dégradé de gris.
// forceLampes : intensité des lumières ponctuelles (moindre sur des surfaces claires, sinon tout sature).
const JEUX = {
  neutre: {
    fond: "#000000", murDessus: "#2B2D31", murFace: "#1B1C1F", sol: "#141518",
    meubleSombre: "#222428", meubleClair: "#2E3034", support: "#26282C", ampoule: "#3A3A3A",
    lumiere: "#FFA757", poussiere: "#F0B46A", flux: "#6B9EFF", braise: "#FF6B1F",
    meublesReels: false, forceLampes: 120, forceTache: 0.42, forceHalo: 0.95, ambiante: 1,
    // 0.42.0 : couche neutralisante sous la tache au sol (un sol orangé ne doit pas teinter un blanc froid)
    forceNeutre: 0.5,
    // 0.6.0 : écran de la télé allumée (lumière froide) et signe du son (rôle « musique » de la palette)
    ecran: "#AFC6FF", musique: "#6FD3C1", forceEcran: 60,
  },
  couleur: {
    fond: "#000000", murDessus: "#F4EFE6", murFace: "#A9A196", sol: "#B48A62",
    sol_sejour: "#C2925F", sol_circulation: "#A9845E", sol_chambre: "#7F95B0", sol_salle_de_bain: "#6FA9A3",
    meubleSombre: "#3A3530", meubleClair: "#D9CCB6", support: "#2E2B28", ampoule: "#6A6560",
    lumiere: "#FFA757", poussiere: "#F0B46A", flux: "#6B9EFF", braise: "#FF6B1F",
    // ambiante 0,78 : les surfaces claires rendent à 78 % de leur teinte, ce qui laisse de la marge aux
    // lampes avant le blanc pur (retour du 22/10 : canapé et cuisine brûlés près des lampes allumées)
    // 0.5.2 : plafond des blancs à 0,8 (aucun canal au-delà de 204) au lieu d'une ambiante baissée partout :
    // les couleurs saturées et l'ombrage restent entiers, seuls les blancs descendent
    meublesReels: true, forceLampes: 6, forceTache: 0.1, forceHalo: 0.3, ambiante: 1, plafondBlanc: 0.8,
    forceNeutre: 0.3,
    ecran: "#AFC6FF", musique: "#6FD3C1", forceEcran: 8,
  },
};
const TEINTES = { ...JEUX.neutre };
let jeu = "neutre";
// 0 à 1 : clarté de l'appartement (murs, sols, meubles), envoyée par l'appli selon l'heure et la palette.
// Les lampes gardent leur éclat : la nuit, l'appartement s'assombrit et les lumières ressortent.
let intensite = 1;

// ---------- rendu ----------
// toile transparente (0.7.0) : le fond du régime vivant est dessiné dessous, dans #fond
const rendu = new T.WebGLRenderer({ antialias: true, alpha: true });
rendu.setClearColor(0x000000, 0);
// résolution réglable une fois au chargement (?pr=1.25), 1,5 au plus par défaut
rendu.setPixelRatio(Math.min(window.devicePixelRatio || 1, +(params.get("pr") || 0) > 0 ? +params.get("pr") : 1.5));
rendu.outputColorSpace = T.SRGBColorSpace;
// sans courbe de tons : les teintes de la palette sortent telles quelles sous la lumière ambiante
rendu.toneMapping = T.NoToneMapping;
// la toile est dans #scene, que l'écran ambiant atténue pendant l'écoute
document.getElementById("scene").prepend(rendu.domElement);
const scene = new T.Scene();
// pas de fond dans la scène : la teinte « fond » colore la page (body), le régime vivant dessine #fond
document.body.style.background = TEINTES.fond;

const E = DONNEES.emprise;
const CX = (E.xmin + E.xmax) / 2, CY = (E.ymin + E.ymax) / 2;
// repère du plan (x, y, hauteur z) vers three.js (X, Y haut, Z)
const V = (x, y, z = 0) => new T.Vector3(x - CX, z, -(y - CY));

// Lumière ambiante blanche d'intensité pi : un matériau mat rend alors exactement sa teinte (Lambert).
// La nuit, seules les lampes allumées éclairent en plus, d'une lumière chaude.
const AMBIANTE_NUIT = Math.PI, AMBIANTE_JOUR = 4 * Math.PI;
const ambiante = new T.AmbientLight(0xffffff, AMBIANTE_NUIT);
scene.add(ambiante);

const camera = new T.PerspectiveCamera(38, 1, 0.1, 200);
// Zone de la fenêtre où l'appartement est cadré (0.5.0), en fractions de la fenêtre. La toile couvre
// toujours toute la fenêtre (lumières et particules débordent librement), mais la projection est décalée
// (setViewOffset) pour que le cadrage « tout l'appartement » ou « une pièce » remplisse cette zone.
// Par défaut un peu plus petit qu'avant (demande du 22/10).
// 0.6.2 : par défaut la zone A de l'accueil validée (sans musique), pour qu'il n'y ait pas de
// saut au chargement avant le premier appel de l'appli
const zone = { x: 0.5, y: 0.275, l: 0.444, h: 0.45 };
let zoneAnim = null;
function zonePx() {
  return { x: zone.x * innerWidth, y: zone.y * innerHeight,
           w: Math.max(1, zone.l * innerWidth), h: Math.max(1, zone.h * innerHeight) };
}
const aspZone = () => { const z = zonePx(); return z.w / z.h; };
function appliquerZone() {
  const z = zonePx();
  camera.aspect = z.w / z.h;
  camera.setViewOffset(z.w, z.h, -z.x, -z.y, Math.max(1, innerWidth), Math.max(1, innerHeight));
  camera.updateProjectionMatrix();
}

// ---------- textures dessinées ----------
function textureHalo() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), d = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  d.addColorStop(0, "rgba(255,255,255,1)"); d.addColorStop(0.18, "rgba(255,255,255,0.55)");
  d.addColorStop(0.5, "rgba(255,255,255,0.12)"); d.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = d; g.fillRect(0, 0, 128, 128);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const HALO = textureHalo();
function texteAuSol(texte, largeurM) {
  const c = document.createElement("canvas"), g = c.getContext("2d");
  c.width = 512; c.height = 96;
  g.font = "600 44px system-ui, 'Segoe UI', Roboto, sans-serif";
  const lignes = [];
  let l = "";
  for (const mot of texte.split(" ")) {
    const essai = l ? l + " " + mot : mot;
    if (g.measureText(essai).width > 500 && l) { lignes.push(l); l = mot; } else l = essai;
  }
  lignes.push(l);
  c.height = 56 * lignes.length + 16;
  g.font = "600 44px system-ui, 'Segoe UI', Roboto, sans-serif";
  g.fillStyle = "rgba(255,255,255,0.9)"; g.textAlign = "center"; g.textBaseline = "middle";
  lignes.forEach((s, i) => g.fillText(s, 256, 36 + 56 * i));
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace;
  const larg = Math.min(largeurM * 0.85, 2.2), haut = larg * c.height / c.width;
  const m = new T.Mesh(new T.PlaneGeometry(larg, haut),
    new T.MeshBasicMaterial({ map: t, transparent: true, opacity: 0.35, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  return m;
}

// ---------- appartement ----------
// Un seul matériau mat (Lambert), les teintes portées par les sommets : le dessus des murs et leurs faces
// n'ont pas la même teinte, chaque meuble garde son rang de clarté d'origine entre deux gris neutres.
const MAT = new T.MeshLambertMaterial({ vertexColors: true, dithering: true });
// Pavés fusionnés en un seul maillage par famille (un appel de dessin au lieu de dizaines, pour la tablette)
function paves(liste) {
  const pos = [], nor = [], idx = [], boite = [];
  liste.forEach((b, n) => {
    const [x0, y0, x1, y1, z0, z1] = b, g = new T.BoxGeometry(x1 - x0, z1 - z0, y1 - y0);
    g.translate(...V((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2).toArray());
    const base = pos.length / 3;
    pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array);
    for (let i = 0; i < g.attributes.position.count; i++) boite.push(n);
    g.index.array.forEach(i => idx.push(base + i));
    g.dispose();
  });
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new T.Float32BufferAttribute(nor, 3));
  g.setAttribute("color", new T.Float32BufferAttribute(new Array(pos.length).fill(0), 3));
  g.setIndex(idx);
  const m = new T.Mesh(g, MAT);
  m.userData.boite = boite;
  return m;
}
// teinte de chaque sommet d'un maillage de pavés : teinte(numéro du pavé, composante verticale de la normale)
function colorer(mesh, teinte) {
  const col = mesh.geometry.attributes.color, nor = mesh.geometry.attributes.normal, b = mesh.userData.boite;
  for (let i = 0; i < col.count; i++) { const c = teinte(b[i], nor.getY(i)); col.setXYZ(i, c.r, c.g, c.b); }
  col.needsUpdate = true;
}
// noms des pièces écrits au sol, cachés sur l'écran ambiant
const nomsSol = [];
// ce que le doigt peut toucher pour « toucher le plan » (sols, murs, meubles), voir dansLePlan
const solides = [];
const murs = paves(DONNEES.murs), linteaux = paves(DONNEES.linteaux);
scene.add(murs, linteaux);
solides.push(murs);
let hauteurMurs = 1.1;
function reglerMurs(h) {
  hauteurMurs = h;
  murs.scale.y = h / DONNEES.hauteur;
  linteaux.visible = h >= DONNEES.hauteur - 0.01;
  demander();
}

// un matériau de sol par pièce : le jeu « couleur » teinte les sols selon le type de pièce
const MATS_SOL = [];
for (const p of DONNEES.pieces) {
  const forme = new T.Shape(p.polygone.map(([x, y]) => new T.Vector2(x - CX, y - CY)));
  const g = new T.ShapeGeometry(forme); g.rotateX(-Math.PI / 2);
  const mat = new T.MeshLambertMaterial({ color: TEINTES.sol, dithering: true });
  mat.userData.type = p.type; MATS_SOL.push(mat);
  const sol = new T.Mesh(g, mat);
  sol.position.y = 0.001;
  scene.add(sol);
  solides.push(sol);
  const xs = p.polygone.map(q => q[0]), ys = p.polygone.map(q => q[1]);
  let ax = 0, ay = 0, aa = 0;   // centre de gravité
  p.polygone.forEach(([x1, y1], i) => {
    const [x2, y2] = p.polygone[(i + 1) % p.polygone.length], c = x1 * y2 - x2 * y1;
    aa += c; ax += (x1 + x2) * c; ay += (y1 + y2) * c;
  });
  const etiquette = texteAuSol(p.nom, Math.max(...xs) - Math.min(...xs));
  etiquette.position.copy(V(ax / (3 * aa), ay / (3 * aa), 0.02));
  scene.add(etiquette);
  nomsSol.push(etiquette);
}
const meubles = paves(DONNEES.meubles.map(m => m.boite));
scene.add(meubles);
solides.push(meubles);
// rang de clarté de chaque meuble d'après sa couleur d'origine (0 le plus sombre, 1 le plus clair)
const clartes = (() => {
  const l = DONNEES.meubles.map(m => { const c = new T.Color(m.couleur); return 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b; });
  const tri = [...l].sort((a, b) => a - b);
  return l.map(v => tri.length > 1 ? tri.indexOf(v) / (tri.length - 1) : 0.5);
})();

// ---------- lampes ----------
const lampes = new Map();      // entité vers objet lampe
const cibles = [];              // zones de toucher
function kelvinVersCouleur(k) {
  const t = k / 100; let r, g, b;
  if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
  else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
  const c = v => Math.max(0, Math.min(255, v)) / 255;
  return new T.Color(c(r), c(g), c(b));
}
// lumière d'une lampe sans couleur donnée par Home Assistant (teinte « lumiere » de la palette)
const BLANC_CHAUD = new T.Color(TEINTES.lumiere);
// teinte d'une ampoule éteinte, de la braise d'une extinction, du flux bleu d'une action

// La maison ne répond plus (0.4.1) : l'état montré n'est plus sûr, les lumières passent en gris.

const SOL_CHAUD = new T.Color(1, 0.6, 0.3);

// Teintes de la palette de l'appli (0.4.1), appliquées à toute la scène. Depuis la 0.5.0 : clé « jeu »

// « eteindre » ou « regler » (seul ou avec l'état HA lu : {effet, state, attributes}). La lampe repart
// de son état d'avant, la caméra vole vers elle, un flux de particules bleues (celles de l'orbe)
// tourne et se resserre sur l'ampoule, puis elle bascule : éclat, lumière qui s'étale au sol et deux

// retour animé à la vue large (à l'angle courant si la scène tourne), puis reprise de la rotation

// ---------- régimes de l'accueil (0.7.0) ----------
// Vivant (1) quand quelqu'un est devant la tablette, la touche ou lui parle : fond en dégradé, ombre de
// contact et flaque de lumière sous l'appartement, grain, particules qui flottent dans la moitié droite,
// appartement plus saturé. En retrait (0) : noir pur, rien de tout cela, appartement désaturé. Valeurs de
// la planche « Accueil vivant et en retrait » validée le 22/10. Le soir (intensité 0,2 et

const toileFond = document.getElementById("fond"), cFond = toileFond.getContext("2d");

const grainMotif = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const g = c.getContext("2d"), d = g.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }

// particules : position de base en fractions de la fenêtre (moitié droite), dérive lente
const particulesFond = Array.from({ length: 40 }, (_, i) => ({
  x: 0.5 + 0.5 * Math.random(), y: Math.random(), rayon: 1.2 + 2 * Math.random(), chaude: i % 9 < 4,
  ax: 0.01 + 0.02 * Math.random(), ay: 0.008 + 0.015 * Math.random(), periode: 22000 + 26000 * Math.random(),
  phase: 2 * Math.PI * Math.random(), tirage: Math.random(),

// saturation et clarté de l'appartement (filtre CSS de la toile 3D), opacité du fond

// dessine #fond ; renvoie vrai si des particules bougent (la boucle garde alors sa cadence de repos)
function dessinerFond(t) {
  if (regime.v <= 0.003) return false;

  if (toileFond.width !== W || toileFond.height !== H) { toileFond.width = W; toileFond.height = H; }
