<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E8E2D6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Maison</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icones/icone-192.png">
<link rel="stylesheet" href="/app.css">
<script src="/client.js" defer></script>
<script src="/maison.js" defer></script>
</head>
<body>
<main id="contenu-maison" class="contenu">
<p class="lien-retour"><a href="/">Accueil</a></p>
<h1 class="titre-page">Maison</h1>

<div id="bandeau-essai" class="alerte alerte--info" role="status" hidden><b>Mode essai.</b> Rien ne sera fait dans la maison. {{nom_assistant}} dit seulement ce qu'elle ferait.</div>
<p id="erreur-maison" class="alerte alerte--danger" role="alert" hidden></p>
<p id="statut-maison" class="secondaire" role="status">Lecture de la maison en cours.</p>

<div id="alertes-air" class="alertes-air" hidden></div>
<div id="liste-pieces"></div>

<section id="carte-vide" class="carte" aria-labelledby="titre-vide" hidden>
<h2 class="surtitre" id="titre-vide">Aucune pièce</h2>
<p id="texte-vide" class="secondaire"></p>
</section>

<p id="lu-a" class="secondaire" hidden></p>

<p class="version" aria-label="Versions"><span>Client web {{version_client}}</span><span>Serveur {{version_serveur}}</span><span>{{date}}</span></p>
</main>
<div id="volet-maison"></div>
</body>
</html>
