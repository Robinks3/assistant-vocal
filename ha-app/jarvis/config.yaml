# Nom affiché remplacé au déploiement par la section assistant de maison.json (deployer.sh).
name: Assistant vocal local
version: "0.59.1"
slug: jarvis
description: Serveur de l'assistant vocal local (téléphones satellites), sans PC fixe.
# 0.36.3 : aarch64 ajouté (Raspberry Pi 4 et 5, Home Assistant Green). L'image python:3.12-slim et les
# dépendances de requirements.txt existent pour les deux architectures.
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
# 0.34.0 : administration dans Home Assistant (barre latérale), servie par Ingress. Le port 8099 n'est pas publié :
# seul le superviseur (172.30.32.2) y accède. Réservée aux administrateurs de HA de administration.utilisateurs_ha.
# https://contributors.home-assistant.io/apps/guides/ingress/
ingress: true
ingress_port: 8099
panel_icon: mdi:account-key
panel_title: Assistant vocal
panel_admin: true
ports:
  8765/tcp: 8765
  8766/tcp: 8766
ports_description:
  8765/tcp: Satellites vocaux, en clair (ancien accès, à couper quand tous les téléphones sont à jour)
  8766/tcp: Satellites vocaux, chiffré (wss), appairage des nouveaux téléphones
options:
  anthropic_api_key: ""
  satellite_jeton: ""
  essai: false
  ancien_acces: true
  stt_api_cle: ""
  stt_api_url: "https://api.mistral.ai/v1/audio/transcriptions"
  stt_api_modele: "voxtral-mini-latest"
  stt_api_nom: "Voxtral"
  sante_jeton: ""
  llm_local_url: ""
schema:
  anthropic_api_key: password
  satellite_jeton: password
  essai: bool
  ancien_acces: bool
  stt_api_cle: password
  stt_api_url: url
  stt_api_modele: str
  stt_api_nom: str
  sante_jeton: password
  llm_local_url: str
