<text x="670" y="598" font-size="12.5" fill="#BAC3D0">« Routine Arrivée lancée. »</text>
<text x="24" y="712" font-size="13" fill="#BAC3D0">Le moteur exécute lui-même chaque étape, aucune automatisation Home Assistant n'est générée.</text>
<text x="24" y="732" font-size="13" fill="#BAC3D0">La sécurité en dur reste donc appliquée à chaque lancement, avec les droits de la personne qui lance.</text>
