<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 676" width="100%" role="img" aria-label="Scénario 3 : le PC fait tout, sauf le réveil" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Scénario 3 : le PC fait tout, sauf le réveil</title><desc>Rien ne quitte la maison. Le son ne part vers le PC qu'après le mot de réveil, entendu sur la tablette. Le PC doit rester allumé avec sa carte graphique : Qwen 3.5 9B, 6,5 Go de mémoire vidéo, 2,7 à 3,8 s par réponse. Réglage : mode "Serveur du PC", cerveau "PC (carte graphique)", réveil sur l'appareil. C'est le mode de développement.</desc>
