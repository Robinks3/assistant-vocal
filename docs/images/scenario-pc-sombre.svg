<text x="24" y="584" font-size="13" font-weight="700" fill="#8F9AAA" letter-spacing="0.06em">CE QUI QUITTE LA MAISON, ET LE RÉGLAGE</text>
<text x="24" y="610" font-size="13.5" fill="#BAC3D0">Rien ne quitte la maison. Le son ne part vers le PC qu'après le mot de réveil, entendu sur la tablette.</text>
<text x="24" y="632" font-size="13.5" fill="#BAC3D0">Le PC doit rester allumé avec sa carte graphique : Qwen 3.5 9B, 6,5 Go de mémoire vidéo, 2,7 à 3,8 s par réponse.</text>
