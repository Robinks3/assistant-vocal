<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" role="img" aria-label="Trajet d'une phrase, du mot de réveil à la réponse vocale" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Trajet d'une phrase, du mot de réveil à la réponse vocale</title><desc>Réveil, écoute, reconnaissance, contexte de requête, cerveau, contrôles de sécurité en dur, appel de Home Assistant, puis réponse vocale. Un refus de la sécurité répond sans rien exécuter.</desc>
