<rect x="0.5" y="0.5" width="899" height="639" rx="22" fill="url(#fond)" stroke="#E1E6ED"/><rect x="0.5" y="0.5" width="899" height="639" rx="22" fill="url(#lueurFond)"/>
<text x="24" y="44" font-size="22" font-weight="700" fill="#1A2130">Trajet d'une phrase</text>
<text x="24" y="70" font-size="14.5" fill="#434E5E">Du mot de réveil à l'action, avec la sécurité en dur placée avant Home Assistant.</text>
