<text x="293" y="131" font-size="16" font-weight="600" fill="#1A2130">Écoute</text>
<text x="261" y="158" font-size="13" fill="#434E5E">Silero VAD, fin de</text>
<text x="261" y="178" font-size="13" fill="#434E5E">phrase après 0,45 s</text>
