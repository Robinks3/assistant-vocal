<rect x="463.3" y="316" width="194.3" height="32" rx="9" fill="none" stroke="#D5DCE6" stroke-width="1.2"/>
<text x="471.3" y="330" font-size="11.5" fill="#1A2130">device_id, floor_id,</text>
<text x="471.3" y="343" font-size="11.5" fill="#1A2130">label_id refusés</text>
<rect x="665.7" y="316" width="194.3" height="32" rx="9" fill="#EEF2F7"/>
