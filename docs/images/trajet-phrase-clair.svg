<text x="72" y="131" font-size="16" font-weight="600" fill="#1A2130">Réveil</text>
<text x="40" y="158" font-size="13" fill="#434E5E">openWakeWord, sur</text>
<text x="40" y="178" font-size="13" fill="#434E5E">l'appareil ou le PC</text>
