<text x="735" y="131" font-size="16" font-weight="600" fill="#1A2130">Contexte</text>
<text x="703" y="158" font-size="13" fill="#434E5E">Personne, rôle et</text>
<text x="703" y="178" font-size="13" fill="#434E5E">appareil en argument</text>
