<text x="261" y="304" font-size="12.5" fill="#5F6977">poc/securite.py, avant tout appel à Home Assistant</text>
<rect x="261" y="316" width="194.3" height="32" rx="9" fill="#EEF2F7"/>
<rect x="261" y="316" width="194.3" height="32" rx="9" fill="none" stroke="#D5DCE6" stroke-width="1.2"/>
