<text x="514" y="131" font-size="16" font-weight="600" fill="#1A2130">Reconnaissance</text>
<text x="482" y="158" font-size="13" fill="#434E5E">Canary, Speech-to-Phrase</text>
<text x="482" y="178" font-size="13" fill="#434E5E">ou API, puis dictionnaire</text>
