<text x="40" y="310" font-size="13" fill="#434E5E">Dictionnaire d'abord,</text>
<text x="40" y="330" font-size="13" fill="#434E5E">sinon un LLM qui</text>
<text x="40" y="350" font-size="13" fill="#434E5E">propose un appel :</text>
<text x="40" y="370" font-size="13" fill="#434E5E">Claude ou Qwen local</text>
