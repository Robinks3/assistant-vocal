<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="100%" role="img" aria-label="Routines : création à la voix, exécution et exemple" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Routines : création à la voix, exécution et exemple</title><desc>Une routine est une phrase qui lance une liste d'étapes. Sacha la crée à la voix, le LLM propose, le serveur vérifie et Sacha confirme. Le moteur exécute lui-même chaque étape avec la sécurité en dur. Tout est prévu, la conception est validée.</desc>
