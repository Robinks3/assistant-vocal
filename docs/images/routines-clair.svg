<text x="670" y="579" font-size="12.5" font-weight="600" fill="#8F5413">Réponse dite</text>
<text x="670" y="598" font-size="12.5" fill="#434E5E">« Routine Arrivée lancée. »</text>
<text x="24" y="712" font-size="13" fill="#434E5E">Le moteur exécute lui-même chaque étape, aucune automatisation Home Assistant n'est générée.</text>
<text x="24" y="732" font-size="13" fill="#434E5E">La sécurité en dur reste donc appliquée à chaque lancement, avec les droits de la personne qui lance.</text>
