<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 872" width="100%" role="img" aria-label="Architecture par machine : satellites, serveur de la maison, services en ligne et PC de développement facultatif" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Architecture par machine : satellites, serveur de la maison, services en ligne et PC de développement facultatif</title><desc>L'appli Android guette le mot de réveil sur la tablette et n'envoie le son qu'après lui. En mode autonome, elle découpe la phrase, la transcrit, la cherche dans le dictionnaire, applique la sécurité en dur et répond avec la voix d'Android, un petit LLM et la vision restant en option. Les satellites parlent en wss sur le port 8766 à l'appli de l'assistant, installée dans Home Assistant sur le serveur de la maison, toujours allumé. Elle transcrit par Speech-to-Phrase, avec un repli Voxtral par API, décide par dictionnaire puis Claude par API, et pilote Home Assistant. La page d'administration passe par Ingress. Le PC fixe n'est qu'un poste de développement facultatif : il fait tourner le même moteur en profil pc, Canary et un LLM local, et sert pour l'instant le client web par Tailscale Serve.</desc>
