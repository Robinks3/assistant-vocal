<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" role="img" aria-label="Architecture : satellites, serveur des satellites, Home Assistant et services facultatifs" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Architecture : satellites, serveur des satellites, Home Assistant et services facultatifs</title><desc>Les satellites parlent au serveur sur les ports 8765 et 8766, le client web viendra sur le port 8767. Le serveur chaîne réveil, reconnaissance, cerveau et voix, passe par la sécurité en dur, puis pilote Home Assistant. LLM, reconnaissance par API et sources publiques sont facultatifs.</desc>
