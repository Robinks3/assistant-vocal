<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 812" width="100%" role="img" aria-label="Architecture par machine : satellites, PC fixe, serveur Home Assistant et services en ligne" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Architecture par machine : satellites, PC fixe, serveur Home Assistant et services en ligne</title><desc>Les satellites parlent au serveur du PC fixe en wss sur le port 8766, le client web passe par Tailscale Serve en HTTPS 443 vers le port 8767 du PC. Le PC pilote Home Assistant par son API. Le serveur Home Assistant porte l'appli de l'assistant, même moteur en profil ha, qui relève le PC quand il est éteint, et la page d'administration servie par Ingress. LLM en ligne, reconnaissance par API et sources publiques sont facultatifs.</desc>
