<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 676" width="100%" role="img" aria-label="Scénario 2 : la tablette, et Claude Haiku en renfort" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Scénario 2 : la tablette, et Claude Haiku en renfort</title><desc>Seul le texte d'une phrase que le dictionnaire n'a pas comprise part chez Claude, jamais le son. La demande passe par l'appli de l'assistant sur HA, la tablette n'a aucune clé d'API. Haiku : 19 ou 20 sur 20 au banc. Réglage de l'appli : mode "Cet appareil", LLM de secours "Haiku par l'appli sur HA". Le PC peut rester éteint.</desc>
