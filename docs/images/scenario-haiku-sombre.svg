<text x="24" y="44" font-size="22" font-weight="700" fill="#F2F5F9">Scénario 2 : la tablette, et Claude Haiku en renfort</text>
<text x="24" y="68" font-size="14.5" fill="#BAC3D0">Une ligne par machine, une colonne par étape, sur la maison d'exemple. Changer de ligne, c'est passer par le réseau.</text>
