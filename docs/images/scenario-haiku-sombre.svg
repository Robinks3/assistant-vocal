<text x="24" y="584" font-size="13" font-weight="700" fill="#8F9AAA" letter-spacing="0.06em">CE QUI QUITTE LA MAISON, ET LE RÉGLAGE</text>
<text x="24" y="610" font-size="13.5" fill="#BAC3D0">Seul le texte d'une phrase que le dictionnaire n'a pas comprise part chez Claude, jamais le son.</text>
<text x="24" y="632" font-size="13.5" fill="#BAC3D0">La demande passe par l'appli de l'assistant sur HA, la tablette n'a aucune clé d'API. Haiku : 19 ou 20 sur 20 au banc.</text>
<text x="24" y="654" font-size="13.5" fill="#BAC3D0">Réglage de l'appli : mode "Cet appareil", LLM de secours "Haiku par l'appli sur HA". Le PC peut rester éteint.</text>
