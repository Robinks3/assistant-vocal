<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 676" width="100%" role="img" aria-label="Scénario 1 : tout sur la tablette" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>Scénario 1 : tout sur la tablette</title><desc>Rien ne quitte la maison. Le son reste sur la tablette, seule la commande validée part vers Home Assistant. Le petit LLM ne sert que si le dictionnaire n'a pas compris : Gemma 4 E2B, 18 sur 20 au banc du 13/10/2026. Réglage de l'appli : mode "Cet appareil", LLM de secours "LLM sur cet appareil". Le PC peut rester éteint.</desc>
